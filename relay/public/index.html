<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Orbit — circle log</title>
<style>
  :root{--bg:#f4f5fb;--card:#fff;--ink:#14162b;--muted:#6b7090;--line:#e3e5f1;--accent:#5b5bf0;
    --joined:#2f9e6a;--left:#8a8fa8;--shared:#5b5bf0;--proposed:#d98a1c;--accepted:#2f9e6a;--declined:#d4455b;--countered:#a24fd6;--paused:#8a8fa8;--resumed:#2f9e6a}
  @media (prefers-color-scheme:dark){:root{--bg:#0e1020;--card:#171a31;--ink:#eceefb;--muted:#9096b8;--line:#262a4a;--accent:#8c8cff;
    --joined:#4cc38a;--left:#8a8fa8;--shared:#8c8cff;--proposed:#f0b04a;--accepted:#4cc38a;--declined:#ff6b82;--countered:#c58cf0;--paused:#8a8fa8;--resumed:#4cc38a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .orb{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff8,transparent 40%),var(--accent);position:relative;flex:none}
  .orb:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink);right:-3px;top:4px;opacity:.85}
  h1{font-size:1.3rem;margin:0;line-height:1.2}
  .sub{color:var(--muted);font-size:.85rem}
  .members{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.85rem}
  ol{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--line)}
  li{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px}
  li:before{content:"";position:absolute;left:-26px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));border:2px solid var(--bg)}
  .meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:2px}
  .type{font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--c,var(--accent))}
  .txt{overflow-wrap:anywhere}
  .msg{text-align:center;color:var(--muted);padding:30px 10px}
  .live{font-size:.75rem;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
<main>
  <header>
    <div class="orb" aria-hidden="true"></div>
    <div><h1 id="title">Orbit circle</h1><div class="sub" id="sub">Loading…</div></div>
  </header>
  <div class="members" id="members"></div>
  <div id="msg" class="msg" hidden></div>
  <ol id="log"></ol>
  <div class="live" id="live"></div>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var code = (q.get('c') || '').toUpperCase();
  var k = new URLSearchParams(location.hash.replace(/^#/, '')).get('k') || '';
  var $ = function (id) { return document.getElementById(id); };
  var COLORS = { joined: 'joined', left: 'left', shared: 'shared', proposed: 'proposed', accepted: 'accepted', declined: 'declined', countered: 'countered', paused: 'paused', resumed: 'resumed' };

  function ago(iso) {
    var s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }
  function showMsg(t) { var m = $('msg'); m.textContent = t; m.hidden = !t; }

  function render(d) {
    document.title = d.name + ' — Orbit circle log';
    $('title').textContent = d.name;
    $('sub').textContent = d.members.length + (d.members.length === 1 ? ' member' : ' members') + ' · live log';
    var mem = $('members'); mem.textContent = '';
    d.members.forEach(function (n) { var c = document.createElement('span'); c.className = 'chip'; c.textContent = n; mem.appendChild(c); });
    var ol = $('log'); ol.textContent = '';
    showMsg(d.entries.length ? '' : 'Nothing here yet.');
    d.entries.forEach(function (e) {
      var li = document.createElement('li');
      li.style.setProperty('--c', 'var(--' + (COLORS[e.type] || 'shared') + ')');
      var meta = document.createElement('div'); meta.className = 'meta';
      var t = document.createElement('span'); t.className = 'type'; t.textContent = e.type;
      var w = document.createElement('span'); w.textContent = ago(e.ts); w.title = new Date(e.ts).toLocaleString();
      meta.appendChild(t); meta.appendChild(w);
      var tx = document.createElement('div'); tx.className = 'txt'; tx.textContent = e.text;
      li.appendChild(meta); li.appendChild(tx); ol.appendChild(li);
    });
    $('live').textContent = 'Updated ' + new Date().toLocaleTimeString() + ' · refreshes every 5s';
  }

  function load() {
    if (!code || !k) { showMsg('This link is missing its circle code or key. Ask your Cubbie for the log link.'); return; }
    fetch('/api/circles/' + encodeURIComponent(code) + '/log?limit=50', { cache: 'no-store', headers: { Authorization: 'Bearer ' + k } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (x) { if (x.ok) render(x.j); else showMsg(x.j.error || 'Could not load the log.'); })
      .catch(function () { showMsg('Cannot reach the server. Retrying…'); });
  }
  load();
  setInterval(function () { if (!document.hidden) load(); }, 5000);
})();
</script>
</body>
</html>
